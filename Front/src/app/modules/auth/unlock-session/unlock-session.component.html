<div class="flex min-w-0 flex-auto flex-col items-center sm:flex-row sm:justify-center md:items-start md:justify-start">


    <div
        class="w-full px-4 py-8 sm:bg-card sm:w-auto sm:rounded-2xl sm:p-12 sm:shadow md:flex md:h-full md:w-1/2 md:items-center md:justify-end md:rounded-none md:p-16 md:shadow-none">
        <div class="mx-auto w-full max-w-80 sm:mx-0 sm:w-80">
            <!-- Logo con efecto -->
            <div
                class="w-16 h-16 bg-gradient-to-br from-red-500 to-orange-600 rounded-xl flex items-center justify-center shadow-lg transform transition-transform hover:scale-105">
                <img src="images/logo/logo.png" class="w-10 h-10 object-contain" />
            </div>
            <br>

            <!-- Title con mejor jerarquía -->
            <div class="text-4xl font-extrabold leading-tight tracking-tight text-gray-900">
                Sesión Bloqueada
            </div>

            <!-- Descripción mejorada -->
            <div class="mt-3 text-base text-gray-600 leading-relaxed">
                Tu sesión ha sido bloqueada automáticamente por seguridad debido a inactividad prolongada.
            </div>

            <!-- Botón de acción mejorado -->
            <div class="mt-8">
                <button (click)="login()"
                    class="w-full bg-gradient-to-r from-red-600 to-orange-600 text-white font-semibold py-3 px-6 rounded-lg shadow-md hover:shadow-lg transform transition-all duration-200 hover:scale-[1.02] active:scale-[0.98] focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2">
                    <span class="flex items-center justify-center">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
                        </svg>
                        Regresar al Inicio de Sesión
                    </span>
                </button>
            </div>
        </div>
    </div>

    <div
        class="relative hidden h-full w-1/2 flex-auto items-center justify-center overflow-hidden bg-red-600 bg-cover bg-center bg-no-repeat p-16 dark:border-l md:flex lg:px-28">
        <!-- Rings -->
        <svg class="absolute inset-0 pointer-events-none" viewBox="0 0 960 540" width="100%" height="100%"
            preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
            <g class="text-red-300 opacity-20" fill="none" stroke="currentColor" stroke-width="100">
                <circle r="234" cx="196" cy="23"></circle>
                <circle r="234" cx="790" cy="491"></circle>
            </g>
        </svg>
        <!-- Dots -->
        <svg class="absolute -top-16 -right-16 text-red-400 opacity-30" viewBox="0 0 220 192" width="220" height="192"
            fill="none">
            <defs>
                <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
                    <rect x="0" y="0" width="4" height="4" fill="currentColor"></rect>
                </pattern>
            </defs>
            <rect width="220" height="192" fill="url(#dots)"></rect>
        </svg>
        <!-- Content -->
        <div class="relative z-10 w-full max-w-2xl text-white">
            <div class="text-7xl font-bold leading-none text-yellow-100">
                <div>BIENVENIDO</div>
            </div>
            <div class="flex items-center">
                <p class="text-lg">Alkode</p>
            </div>
        </div>
    </div>

</div>
