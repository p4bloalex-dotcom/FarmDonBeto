<div class="flex min-w-0 flex-auto flex-col items-center sm:flex-row sm:justify-center md:items-start md:justify-start">
    <div
        class="w-full px-4 py-8 sm:bg-card sm:w-auto sm:rounded-2xl sm:p-12 sm:shadow md:flex md:h-full md:w-1/2 md:items-center md:justify-end md:rounded-none md:p-16 md:shadow-none">
        <div class="mx-auto w-full max-w-80 sm:mx-0 sm:w-80">

            <div class="w-12">
                <img src="images/logo/logo.png" />
            </div>

            <div class="mt-8 text-2xl font-extrabold leading-tight tracking-tight">
                Iniciar sesión
            </div>

            <form class="mt-8" [formGroup]="signInForm" #signInNgForm="ngForm">

                <mat-form-field class="w-full">
                    <mat-label>Usuario</mat-label>
                    <input id="UserName" matInput [formControlName]="'UserName'" autocomplete="off" />
                    @if (signInForm.get('UserName').hasError('required')) {
                    <mat-error> Nombre de usuario es requerido </mat-error>
                    }
                </mat-form-field>

                <mat-form-field class="w-full">
                    <mat-label>Contraseña</mat-label>
                    <input id="Password" matInput type="password" [formControlName]="'Password'" #passwordField
                        autocomplete="off" />
                    <button mat-icon-button type="button" (click)="
                            passwordField.type === 'password'
                                ? (passwordField.type = 'text')
                                : (passwordField.type = 'password')
                        " matSuffix>
                        @if (passwordField.type === 'password') {
                        <mat-icon class="icon-size-5" [svgIcon]="'heroicons_solid:eye'"></mat-icon>
                        }
                        @if (passwordField.type === 'text') {
                        <mat-icon class="icon-size-5" [svgIcon]="'heroicons_solid:eye-slash'"></mat-icon>
                        }
                    </button>
                    <mat-error> Contraseña requerida </mat-error>
                </mat-form-field>


                <button class="fuse-mat-button-large mt-6 w-full" mat-flat-button [color]="'primary'"
                    [disabled]="signInForm.disabled" (click)="signIn()">
                    @if (!signInForm.disabled) {
                    <span> Iniciar sesión </span>
                    }
                    @if (signInForm.disabled) {
                    <mat-progress-spinner [diameter]="24" [mode]="'indeterminate'"></mat-progress-spinner>
                    }
                </button>
            </form>
        </div>
    </div>
    <div
        class="relative hidden h-full w-1/2 flex-auto items-center justify-center overflow-hidden bg-red-600 bg-cover bg-center bg-no-repeat p-16 dark:border-l md:flex lg:px-28">
        <!-- Rings -->
        <svg class="absolute inset-0 pointer-events-none" viewBox="0 0 960 540" width="100%" height="100%"
            preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
            <g class="text-red-300 opacity-20" fill="none" stroke="currentColor" stroke-width="100">
                <circle r="234" cx="196" cy="23"></circle>
                <circle r="234" cx="790" cy="491"></circle>
            </g>
        </svg>
        <!-- Dots -->
        <svg class="absolute -top-16 -right-16 text-red-400 opacity-30" viewBox="0 0 220 192" width="220" height="192"
            fill="none">
            <defs>
                <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
                    <rect x="0" y="0" width="4" height="4" fill="currentColor"></rect>
                </pattern>
            </defs>
            <rect width="220" height="192" fill="url(#dots)"></rect>
        </svg>
        <!-- Content -->
        <div class="relative z-10 w-full max-w-2xl text-white">
            <div class="text-7xl font-bold leading-none text-yellow-100">
                <div>Alkode</div>
            </div>
            <div class="flex items-center">
                <p class="text-lg">Sistemas para negocios</p>
            </div>
        </div>
    </div>
</div>
