<div class="bg-card flex min-w-0 flex-auto flex-col dark:bg-transparent sm:absolute sm:inset-0 sm:overflow-hidden">
    <div
        class="relative flex flex-0 flex-col border-b px-6 py-4 sm:flex-row sm:items-center sm:justify-between md:px-8">
        <div class="text-3xl font-extrabold tracking-tight">Accesos menus</div>
        <div class="mt-6 flex shrink-0 items-center sm:ml-4 sm:mt-0">
            <!-- Search -->
            <mat-form-field class="fuse-mat-dense fuse-mat-rounded min-w-64" [subscriptSizing]="'dynamic'">
                <mat-icon class="icon-size-5" matPrefix [svgIcon]="'heroicons_solid:magnifying-glass'"></mat-icon>
                <input matInput [formControl]="searchInputControl" [autocomplete]="'off'" [placeholder]="'Buscar'" />
            </mat-form-field>
            @if (!dataForm.invalid) {
            <button class="ml-4" mat-flat-button [color]="'primary'" (click)="openDialog(null, 1)">
                <mat-icon [svgIcon]="'heroicons_outline:plus'"></mat-icon>
                <span class="ml-2 mr-1">Crear</span>
            </button>
            }

        </div>
    </div>

    <div class="flex justify-center w-full overflow-hidden p-4">
        <form [formGroup]="dataForm" class="flex flex-col md:flex-row md:items-center md:space-x-4 w-full max-w-3xl">

            <mat-form-field class="flex-1">
                <mat-label>Selecione el rol</mat-label>
                <mat-select [value]="" formControlName="idRole">
                    <mat-option [value]=""></mat-option>
                    @for ( item of axData1; track trackByFn($index, item)) {
                    <mat-option [value]="item.id">{{item.name}}</mat-option>
                    }
                </mat-select>
            </mat-form-field>

            <button mat-flat-button color="primary" [disabled]="dataForm.invalid" (click)="find()"
                class="h-12 w-32 mt-4 md:mt-0">
                <span>Buscar</span>
            </button>
        </form>
    </div>

    <div class="flex flex-auto overflow-hidden">
        <div class="flex flex-auto flex-col overflow-hidden sm:mb-18 sm:overflow-y-auto">
            <app-table [columns]="columns" [data]="pagedData" [actions]="actions" actionColumnWidth="1fr"
                [length]="totalItems" (pageChange)="onPageChange($event)"
                (rowAction)="handleRowAction($event)"></app-table>
        </div>
    </div>

</div>
