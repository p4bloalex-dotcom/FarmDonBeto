<div class="bg-card flex min-w-0 flex-auto flex-col dark:bg-transparent sm:absolute sm:inset-0 sm:overflow-hidden">
    @if (isLoading) {
        <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    }
    <div class="relative flex flex-0 flex-col gap-4 border-b px-4 py-4 md:px-8">
        <div>
            <div class="text-2xl font-extrabold tracking-tight sm:text-3xl">Traslados entre sucursales</div>
        </div>
        <div class="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between">
            <div class="grid gap-2 sm:grid-cols-2 lg:w-auto">
                <button type="button" class="rounded-2xl border px-4 py-3 text-left transition" [class.border-primary-500]="activeView === 'requests'" [class.bg-primary-50]="activeView === 'requests'" [class.text-primary-800]="activeView === 'requests'" (click)="selectView('requests')">
                    <div class="font-semibold">Solicitudes de traslado</div>
                </button>
                <button type="button" class="rounded-2xl border px-4 py-3 text-left transition" [class.border-primary-500]="activeView === 'movements'" [class.bg-primary-50]="activeView === 'movements'" [class.text-primary-800]="activeView === 'movements'" (click)="selectView('movements')">
                    <div class="font-semibold">Movimientos aplicados</div>
                </button>
            </div>
            <div class="flex w-full shrink-0 flex-col gap-3 sm:w-auto sm:flex-row sm:items-center">
            <mat-form-field class="fuse-mat-dense fuse-mat-rounded w-full sm:min-w-64" [subscriptSizing]="'dynamic'">
                <mat-icon class="icon-size-5" matPrefix [svgIcon]="'heroicons_solid:magnifying-glass'"></mat-icon>
                <input matInput [formControl]="searchInputControl" [autocomplete]="'off'" [placeholder]="activeView === 'requests' ? 'Buscar solicitud o sucursal' : 'Buscar movimiento o sucursal'" />
            </mat-form-field>
            @if (activeView === 'requests') {
            <button class="w-full sm:w-auto" mat-flat-button [color]="'primary'" (click)="openDialog(null, 1)">
                <mat-icon [svgIcon]="'heroicons_outline:plus'"></mat-icon>
                <span class="ml-2 mr-1">Solicitar traslado</span>
            </button>
            }
            </div>
        </div>
    </div>
    <div class="grid gap-3 border-b bg-slate-50 px-4 py-3 text-sm dark:bg-slate-900 md:px-8 lg:grid-cols-3">
        <div class="rounded-2xl bg-white p-3 shadow-sm dark:bg-slate-800">
            <div class="font-semibold">1. Solicitud</div>
        </div>
        <div class="rounded-2xl bg-white p-3 shadow-sm dark:bg-slate-800">
            <div class="font-semibold">2. Envio y entrega</div>
        </div>
        <div class="rounded-2xl bg-white p-3 shadow-sm dark:bg-slate-800">
            <div class="font-semibold">3. Stock aplicado</div>
        </div>
    </div>
    <div class="flex flex-auto overflow-auto">
        <div class="flex min-w-full flex-auto flex-col overflow-auto sm:mb-18">
            @if (activeView === 'requests') {
            <app-table
                [columns]="columns"
                [data]="pagedData"
                [actions]="actions"
                actionColumnWidth="1fr"
                [length]="totalItems"
                (pageChange)="loadCurrentView($event)"
                (rowAction)="handleRowAction($event)"
            ></app-table>
            } @else {
            <app-table
                [columns]="transferColumns"
                [data]="transferData"
                [actions]="transferActions"
                actionColumnWidth="220px"
                [length]="totalItems"
                (pageChange)="loadCurrentView($event)"
                (rowAction)="handleRowAction($event)"
            ></app-table>
            }
        </div>
    </div>
</div>
