<div class="bg-card flex min-w-0 flex-auto flex-col dark:bg-transparent sm:absolute sm:inset-0 sm:overflow-hidden">
    @if (isLoading) {
        <mat-progress-bar mode="indeterminate"></mat-progress-bar>
    }
    <div class="relative flex flex-0 flex-col gap-4 border-b px-4 py-4 sm:flex-row sm:items-center sm:justify-between md:px-8">
        <div>
            <div class="text-2xl font-extrabold tracking-tight sm:text-3xl">Movimientos de stock</div>
            <div class="text-sm text-secondary">Registro de traslados ya aplicados al inventario.</div>
        </div>
        <div class="flex w-full shrink-0 flex-col gap-3 sm:w-auto sm:flex-row sm:items-center">
            <mat-form-field class="fuse-mat-dense fuse-mat-rounded w-full sm:min-w-64" [subscriptSizing]="'dynamic'">
                <mat-icon class="icon-size-5" matPrefix [svgIcon]="'heroicons_solid:magnifying-glass'"></mat-icon>
                <input matInput [formControl]="searchInputControl" [autocomplete]="'off'" [placeholder]="'Buscar movimiento'" />
            </mat-form-field>
        </div>
    </div>
    <div class="flex flex-auto overflow-auto">
        <div class="flex min-w-full flex-auto flex-col overflow-auto sm:mb-18">
            <app-table
                [columns]="columns"
                [data]="pagedData"
                [actions]="actions"
                actionColumnWidth="1fr"
                [length]="totalItems"
                (pageChange)="onPageChange($event)"
                (rowAction)="handleRowAction($event)"
            ></app-table>
        </div>
    </div>
</div>
