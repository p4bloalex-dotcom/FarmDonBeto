<form [formGroup]="dataForm" class="flex max-h-[85vh] w-full flex-col overflow-hidden">
    <div class="border-b px-4 py-3">
        <h2 class="text-xl font-semibold">Abrir caja</h2>
    </div>
    <div class="overflow-y-auto p-4">
        <p class="mb-4 text-secondary">Ingresa el monto con el que inicia la caja en este turno.</p>
        <div class="grid grid-cols-1 gap-4">
            @if (registers.length > 1) {
                <mat-form-field class="w-full">
                    <mat-label>Caja</mat-label>
                    <mat-select formControlName="cashRegisterId">
                        @for (register of registers; track register.id) {
                            <mat-option [value]="register.id">{{ register.name }}</mat-option>
                        }
                    </mat-select>
                </mat-form-field>
            }
            @else if (registerName) {
                <div class="rounded-xl border bg-card px-4 py-3 text-sm font-medium">{{ registerName }}</div>
            }
            <mat-form-field class="w-full">
                <mat-label>Monto de apertura</mat-label>
                <input matInput type="number" min="0" step="0.01" formControlName="openingAmount" />
            </mat-form-field>
        </div>
        <div class="mt-4 flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
            <button mat-flat-button matDialogClose (click)="close()">Cancelar</button>
            <button mat-flat-button color="primary" [disabled]="dataForm.invalid" (click)="save()">Abrir caja</button>
        </div>
    </div>
</form>
