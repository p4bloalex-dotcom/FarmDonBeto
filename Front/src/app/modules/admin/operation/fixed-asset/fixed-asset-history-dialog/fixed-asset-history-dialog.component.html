<div class="max-h-[92vh] overflow-hidden rounded-2xl bg-white shadow-2xl dark:bg-gray-900">
    <div class="flex items-center justify-between gap-3 border-b px-5 py-4">
        <div>
            <div class="text-xl font-bold">Historial de activo fijo</div>
            <div class="text-sm text-secondary">{{ asset.code }} - {{ asset.name }}</div>
        </div>
        <div class="flex gap-2">
            <button mat-stroked-button type="button" (click)="loadHistory()"><mat-icon svgIcon="heroicons_outline:arrow-path"></mat-icon>Actualizar</button>
            <button mat-icon-button type="button" (click)="close()" aria-label="Cerrar"><mat-icon svgIcon="heroicons_outline:x-mark"></mat-icon></button>
        </div>
    </div>

    <div class="max-h-[76vh] overflow-auto p-4">
        <app-table [columns]="columns" [data]="rows" [isLoading]="isLoading" actionColumnWidth="0px"></app-table>
        @if (!rows.length && !isLoading) {
            <div class="border-t p-3 text-sm text-secondary">Este activo no tiene historial registrado.</div>
        }
    </div>
</div>
