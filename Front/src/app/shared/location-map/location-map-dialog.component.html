<div class="flex max-h-[90vh] min-w-0 flex-col overflow-hidden">
  <div class="border-b px-4 py-3">
    <h2 class="text-xl font-semibold">{{ data.title }}</h2>
    <div class="text-sm text-secondary">Seleccione o arrastre el marcador y aplique la ubicacion.</div>
  </div>

  <div class="min-h-0 overflow-y-auto p-4">
    @if (isMapAvailable) {
      <app-location-map [title]="data.title" [latitude]="selection?.latitude ?? data.latitude" [longitude]="selection?.longitude ?? data.longitude" [address]="selection?.address ?? data.address" [height]="520" (locationChange)="onLocationChange($event)" (mapAvailabilityChange)="onMapAvailabilityChange($event)"></app-location-map>
    } @else {
      <div class="rounded-xl border border-amber-200 bg-amber-50 p-4 text-sm text-amber-900">El mapa no esta disponible en este momento. Ingrese las coordenadas manualmente.</div>
      <div class="mt-4 grid gap-3 md:grid-cols-2">
        <mat-form-field class="w-full"><mat-label>Latitud</mat-label><input matInput type="number" [(ngModel)]="fallbackLatitude" /></mat-form-field>
        <mat-form-field class="w-full"><mat-label>Longitud</mat-label><input matInput type="number" [(ngModel)]="fallbackLongitude" /></mat-form-field>
      </div>
    }
  </div>

  <div class="flex flex-col-reverse gap-3 border-t px-4 py-3 sm:flex-row sm:justify-end">
    <button mat-flat-button type="button" mat-dialog-close>Cancelar</button>
    <button mat-flat-button color="primary" type="button" [disabled]="!canApply()" (click)="applySelection()">Aplicar ubicacion</button>
  </div>
</div>
